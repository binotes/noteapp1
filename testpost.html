<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Form with Button</title>
</head>
<body>
    <!-- 定义一个表单 -->
    <form id="noteForm" action="https://example.com/submit" method="POST">
        <!-- 添加一个隐藏的输入字段，用于携带参数 -->
        <input type="hidden" name="note" value="gooo" />

        <!-- 提交按钮 -->
        <button type="submit">Submit Note</button>
    </form>
</body>
</html>
